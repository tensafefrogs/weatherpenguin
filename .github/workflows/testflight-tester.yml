# Adds the App Store Connect account holder to the Internal TestFlight group (only them).
# Run by hand from the Actions tab; safe to run again. app/ios/store/add_tester.py.
name: TestFlight tester
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pyjwt==2.10.1 cryptography==44.0.0
      - run: cd app/ios/store && python3 add_tester.py
