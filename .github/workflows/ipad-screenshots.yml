# The app itself (WKWebView, so Safari's layout engine) on iPad simulators of each size, with sample weather
# (the debug build's launch arguments -sample <name>), in portrait, in landscape from the start (-rotate first) and turned
# to landscape after loading (-rotate landscape), at each text size asked for. tools/screenshot.cjs uses Chromium, which lays some things out differently
# from Safari; run this after changing layout and look at the pictures: it commits them to docs/ipad/ on the branch it ran on.
name: iPad screenshots
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Sample weather (rainLater, hot, cold, warm, rainNow)
        default: warm
      devices:
        description: Simulators, comma-separated (names as Xcode lists them)
        default: iPad mini (A17 Pro), iPad Pro (11-inch) (4th generation), iPad Pro 13-inch (M4)
      text_sizes:
        description: Text sizes, comma-separated (extra-small ... large (the default) ... accessibility-extra-extra-extra-large)
        default: large
defaults:
  run:
    shell: bash
permissions:
  contents: write   # to commit the pictures
concurrency:
  group: ipad-screenshots-${{ github.ref }}   # two runs on one branch would both rewrite docs/ipad
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build the app for the simulator
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          cd app/ios && xcodegen generate
          xcodebuild build -project WeatherPenguin.xcodeproj -scheme WeatherPenguin -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E 'error:' build.log | sort -u | head -40; tail -40 build.log; exit 1; }
      - name: Screenshots
        env:
          SAMPLE: ${{ inputs.sample }}
          DEVICES: ${{ inputs.devices }}
          TEXT_SIZES: ${{ inputs.text_sizes }}
        run: |
          cd app/ios
          case "$SAMPLE" in rainLater|hot|cold|warm|rainNow) ;; *) echo "unknown sample"; exit 1;; esac
          app=$(find build -name 'WeatherPenguin.app' -path '*iphonesimulator*' | head -1)
          runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          mkdir -p shots
          IFS=',' read -ra devices <<< "$DEVICES"; IFS=',' read -ra sizes <<< "$TEXT_SIZES"
          for name in "${devices[@]}"; do
            name=$(echo "$name" | sed 's/^ *//; s/ *$//')
            udid=$(xcrun simctl create "$name" "$name" "$runtime") || { echo "no simulator for $name"; continue; }
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            xcrun simctl install "$udid" "$app"
            sleep 20   # boot banners pass
            for size in "${sizes[@]}"; do
              size=$(echo "$size" | tr -d ' ')
              case "$size" in *[!a-z-]*|'') echo "bad text size"; exit 1;; esac
              xcrun simctl ui "$udid" content_size "$size"
              file=$(echo "$name" | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')$([ "$size" = large ] || echo "-$size")
              # portrait; sideways from the start; turned sideways after it has drawn (-rotate: debug builds only)
              for turn in portrait first landscape; do
                xcrun simctl terminate "$udid" com.weatherpenguin.WeatherPenguin 2>/dev/null || true
                xcrun simctl launch "$udid" com.weatherpenguin.WeatherPenguin -sample "$SAMPLE" -tour false -rotate "$turn"
                sleep 12
                xcrun simctl io "$udid" screenshot "shots/$file-$turn.png"
                sips -Z 1400 "shots/$file-$turn.png" > /dev/null   # half size: enough to see the layout, smaller to commit
              done
            done
            xcrun simctl shutdown "$udid"; xcrun simctl delete "$udid"
          done
          ls -l shots
      - name: Commit the pictures
        run: |
          rm -rf docs/ipad && mkdir -p docs/ipad && cp app/ios/shots/*.png docs/ipad/
          git config user.name 'iPad screenshots'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ipad
          git diff --cached --quiet && exit 0
          git commit -q -m 'iPad screenshots'
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 5; done
          exit 1
