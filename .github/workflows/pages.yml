# Publishes web/ (website + the app UI demo) to GitHub Pages, on pushes to main that change it and by hand.
# One-time setup, and pointing weatherpenguin.com here: README.md, "Website".
name: Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - env:
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: |
          mkdir -p _site
          cp -R web/. _site/
          rm -rf _site/app/test _site/package.json
          # the stats address from the Actions variable (none sent without it)
          python3 -c "import json, os; open('_site/app/config.js', 'w').write('window.WP_CONFIG = ' + json.dumps({'goatcounter': os.environ.get('GOATCOUNTER_URL', '').strip()}) + ';\n')"
          cat _site/app/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
